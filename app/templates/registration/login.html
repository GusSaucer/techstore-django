{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 420px;">
        <!-- Logo Header -->
        <div class="text-center mb-4">
            <a href="{% url 'home' %}" class="text-decoration-none">
                <h2 class="fw-bold text-white"><span class="brand-frog">🐸</span> TechStore</h2>
            </a>
            <p class="text-muted small">Entre com suas credenciais para acessar sua conta</p>
        </div>

        <!-- Card de Login -->
        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-body p-4">
                
                <!-- Mensagens de erro de login -->
                {% if form.errors %}
                    <div class="alert alert-danger alert-dismissible fade show small" role="alert">
                        Usuário ou senha incorretos. Tente novamente.
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endif %}

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <!-- Campo Usuário -->
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuário</label>
                        <input type="text" name="username" id="id_username" class="form-control" placeholder="Seu nome de usuário" required autofocus>
                    </div>

                    <!-- Campo Senha -->
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Senha</label>
                        <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <!-- Redirecionamento após o login -->
                    <input type="hidden" name="next" value="{{ next }}">

                    <!-- Botão Entrar -->
                    <button type="submit" class="btn btn-tech-primary w-100 py-2 mb-3">Entrar</button>

                    <div class="text-center">
                        <a href="{% url 'home' %}" class="text-decoration-none small text-muted">← Voltar para a loja</a>
                    </div>
                    <div class="text-center">
                        <a href="{% url 'signup' %}" class="text-decoration-none small text-muted">Não possui conta? Cadastre-se já</a>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
