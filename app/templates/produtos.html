{% extends 'base.html' %}
{% block content %}

{% for i in produtos %}
{% if i.estoque > 0 %}
<div class="card" style="width: 18rem;">
  <div class="card-body">
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal{{ i.id }}">
      ✏️
    </button>
    <h5 class="card-title">{{ i.nome }}</h5>
    {% if i.desconto %}
    <span class="badge" style="background-color:red; color:white;">DESCONTO</span>
    {% endif %}
    <p class="card-text">R$ {{ i.preco }}</p>
    <a href="#" class="btn btn-primary">Comprar</a>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="exampleModal{{ i.id }}" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel{{ i.id }}" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel{{ i.id }}">{{ i.nome }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">

        <form method="POST">

          {% csrf_token %}
          {{form.as_p}}

          <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
      </div>
    </div>
  </div>
</div>

{% endif %}
{% endfor %}

{% endblock %}
